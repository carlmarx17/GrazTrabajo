<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1a1a1a">2. El experimento nucleo: cuatro ramas emparejadas</text>
  <text x="20" y="48" font-size="12" fill="#666666">Las cuatro arrancan de la MISMA atmosfera inicial. El pulso 1 y el pulso de prueba b son identicos. Aqui se dibuja &#964; = 60 s.</text>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8e44ad"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a085"/></marker>
  </defs>

  <line x1="120" y1="430" x2="830" y2="430" stroke="#333333" stroke-width="1.5"/>
  <g font-size="10.5" fill="#333333" text-anchor="middle">
    <line x1="120" y1="430" x2="120" y2="436" stroke="#333333"/><text x="120" y="450">0</text>
    <line x1="254" y1="430" x2="254" y2="436" stroke="#333333"/><text x="254" y="450">50</text>
    <line x1="389" y1="430" x2="389" y2="436" stroke="#333333"/><text x="389" y="450">100</text>
    <line x1="523" y1="430" x2="523" y2="436" stroke="#333333"/><text x="523" y="450">150</text>
    <line x1="658" y1="430" x2="658" y2="436" stroke="#333333"/><text x="658" y="450">200</text>
    <line x1="792" y1="430" x2="792" y2="436" stroke="#333333"/><text x="792" y="450">250</text>
  </g>
  <text x="830" y="422" font-size="11" text-anchor="end" fill="#333333">tiempo del solver [s]</text>

  <line x1="365" y1="82" x2="365" y2="432" stroke="#8e44ad" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="365" y="74" font-size="11.5" text-anchor="middle" fill="#8e44ad">t&#8342; = instante en que empieza b</text>

  <g font-size="12.5" fill="#1a1a1a">
    <text x="24" y="114">A0</text><text x="50" y="114" font-size="11" fill="#555555">sin haz</text>
    <text x="24" y="179">B0</text><text x="50" y="179" font-size="11" fill="#555555">solo b</text>
    <text x="24" y="244">A1</text><text x="50" y="244" font-size="11" fill="#555555">solo pulso 1</text>
    <text x="24" y="309">B1</text><text x="50" y="309" font-size="11" fill="#555555">pulso 1 + b</text>
  </g>
  <g stroke="#bbbbbb" stroke-width="1">
    <line x1="120" y1="110" x2="830" y2="110"/>
    <line x1="120" y1="175" x2="830" y2="175"/>
    <line x1="120" y1="240" x2="830" y2="240"/>
    <line x1="120" y1="305" x2="830" y2="305"/>
  </g>

  <rect x="123" y="218" width="81" height="22" fill="#c0392b" fill-opacity="0.75"/>
  <text x="163" y="212" font-size="10.5" text-anchor="middle" fill="#c0392b">pulso 1 (30 s)</text>
  <rect x="123" y="283" width="81" height="22" fill="#c0392b" fill-opacity="0.75"/>
  <rect x="365" y="283" width="81" height="22" fill="#1f4e79" fill-opacity="0.8"/>
  <text x="405" y="277" font-size="10.5" text-anchor="middle" fill="#1f4e79">b (30 s)</text>
  <rect x="365" y="153" width="81" height="22" fill="#1f4e79" fill-opacity="0.8"/>
  <text x="405" y="147" font-size="10.5" text-anchor="middle" fill="#1f4e79">b (identico)</text>

  <line x1="204" y1="334" x2="364" y2="334" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="204" y1="329" x2="204" y2="339" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="364" y1="329" x2="364" y2="339" stroke="#c0392b" stroke-width="1.2"/>
  <text x="284" y="352" font-size="11.5" text-anchor="middle" fill="#c0392b">&#964; = tiempo de espera</text>

  <line x1="365" y1="376" x2="605" y2="376" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="485" y="394" font-size="11.5" text-anchor="middle" fill="#8e44ad">t&#8242; = tiempo desde el inicio de b (ventana de analisis)</text>

  <path d="M 352 246 C 336 258, 336 272, 352 282" fill="none" stroke="#16a085" stroke-width="2" marker-end="url(#a3)"/>
  <text x="470" y="250" font-size="11" fill="#16a085">B1 arranca por <tspan font-style="italic">restart</tspan> del perfil de A1 justo antes de t&#8342;:</text>
  <text x="470" y="265" font-size="11" fill="#16a085">comparten UNA trayectoria, no dos que deban coincidir.</text>

  <text x="470" y="128" font-size="11" fill="#555555">B0 y B1 se comparan a igual t&#8242;, no a igual tiempo del solver.</text>

  <rect x="120" y="464" width="710" height="46" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="134" y="483" font-size="11.5" fill="#1a1a1a">&#916;D&#8320; = D[B0] &#8722; D[A0] (sin historia) &#8226; &#916;D&#8321; = D[B1] &#8722; D[A1] (con historia), ambas medidas al mismo t&#8242;</text>
  <text x="134" y="502" font-size="12.5" font-weight="bold" fill="#c0392b">M_D(&#964;, t&#8242;) = &#916;D&#8321; &#8722; &#916;D&#8320; = el error de la aproximacion de pulsos independientes</text>
</svg>
